<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Chat</title>
    <style>
        body { margin: 0; font-family: system-ui, "Microsoft YaHei", sans-serif; background: #f4f5f7; }
        #box { max-width: 800px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; }
        h3 { margin: 16px; color: #333; }
        #log { flex: 1; overflow-y: auto; padding: 0 16px; }
        .msg { margin: 10px 0; padding: 10px 14px; border-radius: 10px; white-space: pre-wrap; line-height: 1.6; max-width: 85%; }
        .user { background: #0d6efd; color: #fff; margin-left: auto; }
        .assistant { background: #fff; color: #222; border: 1px solid #ddd; }
        form { display: flex; gap: 8px; padding: 16px; }
        textarea { flex: 1; resize: none; height: 48px; padding: 8px; font-size: 15px; border: 1px solid #ccc; border-radius: 8px; }
        button { padding: 0 20px; font-size: 15px; border: 0; border-radius: 8px; background: #0d6efd; color: #fff; cursor: pointer; }
        button:disabled { background: #999; }
    </style>
</head>
<body>
    <div id="box">
        <h3>My Chat（本地大模型）</h3>
        <div id="log"></div>
        <form id="form">
            <textarea id="input" placeholder="输入问题，Enter 发送，Shift+Enter 换行"></textarea>
            <button id="send" type="submit">发送</button>
        </form>
    </div>
    <script>
        const log = document.getElementById('log');
        const input = document.getElementById('input');
        const send = document.getElementById('send');
        const messages = [];  // 对话历史，每次都完整发给后端

        function addBubble(role, text) {
            const div = document.createElement('div');
            div.className = 'msg ' + role;
            div.textContent = text;
            log.appendChild(div);
            log.scrollTop = log.scrollHeight;
            return div;
        }

        document.getElementById('form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const question = input.value.trim();
            if (!question) return;
            input.value = '';
            send.disabled = true;
            messages.push({ role: 'user', content: question });
            addBubble('user', question);
            const bubble = addBubble('assistant', '…');
            // fetch 读取流式响应：每收到一段就追加到气泡里
            const resp = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ messages })
            });
            const reader = resp.body.getReader();
            const decoder = new TextDecoder();
            let answer = '';
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                answer += decoder.decode(value, { stream: true });
                bubble.textContent = answer;
                log.scrollTop = log.scrollHeight;
            }
            messages.push({ role: 'assistant', content: answer });
            send.disabled = false;
            input.focus();
        });

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                document.getElementById('form').requestSubmit();
            }
        });
    </script>
</body>
</html>
